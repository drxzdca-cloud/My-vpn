<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мой VPN</title>
<style>
:root{--bg0:#0a0b1a;--card:rgba(255,255,255,.06);--navbg:rgba(20,18,44,.8);--line:rgba(255,255,255,.1);--text:#f2f0ff;--dim:#9a96c0;--a1:#7c5cff;--a2:#19e3c5;--g1:.55;--g2:.0}
:root[data-theme=light]{--bg0:#f1f0fb;--card:rgba(255,255,255,.8);--navbg:rgba(255,255,255,.85);--line:rgba(40,30,90,.12);--text:#1a1633;--dim:#625d8a;--g1:.3}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg0);color:var(--text);font:16px/1.45 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1}
.bg i{position:absolute;inset:0;transition:opacity .8s}
.g1{background:radial-gradient(70% 45% at 50% 0%,#7c5cff,transparent 70%),radial-gradient(50% 30% at 0% 70%,rgba(255,90,170,.35),transparent);opacity:var(--g1)}
.g2{background:radial-gradient(70% 45% at 50% 0%,#19e3c5,transparent 70%),radial-gradient(50% 30% at 100% 75%,rgba(60,140,255,.4),transparent);opacity:0}
body.on .g1{opacity:.12}body.on .g2{opacity:calc(var(--g1) + .05)}
main{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 18px 130px}
.scr{animation:in .4s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px}
.logo svg{width:26px;height:26px}
.badge{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
h1{font-size:30px;font-weight:800;letter-spacing:-.5px;margin-bottom:16px}
h3{font-size:13px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);margin:22px 4px 10px}
.stage{display:flex;flex-direction:column;align-items:center;padding:34px 0 26px}
.orbwrap{position:relative;width:210px;height:210px;display:grid;place-items:center}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--a2);opacity:0}
body.on .ring{animation:pulse 3s ease-out infinite}
.ring:nth-child(2){animation-delay:1s!important}.ring:nth-child(3){animation-delay:2s!important}
@keyframes pulse{from{transform:scale(.85);opacity:.55}to{transform:scale(1.75);opacity:0}}
.orb{position:relative;width:196px;height:196px;border:0;border-radius:50%;cursor:pointer;color:#fff;display:grid;place-items:center;background:radial-gradient(circle at 32% 28%,#b9a8ff,#6a45f5 55%,#2c1a99);box-shadow:0 20px 60px rgba(124,92,255,.55),inset 0 -10px 30px rgba(0,0,0,.25),inset 0 8px 20px rgba(255,255,255,.3);transition:transform .2s,box-shadow .6s}
.orb::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 28%,#9ffbe9,#19d6b4 55%,#0a7d84);opacity:0;transition:opacity .6s}
body.on .orb{box-shadow:0 20px 70px rgba(25,227,197,.6),inset 0 -10px 30px rgba(0,0,0,.2),inset 0 8px 20px rgba(255,255,255,.35)}
body.on .orb::before{opacity:1}
.orb:active{transform:scale(.95)}
.orb svg{position:relative;width:76px;height:76px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25))}
.spin{position:absolute;inset:-9px;border-radius:50%;border:4px solid transparent;border-top-color:var(--text);border-right-color:var(--text);opacity:0;transition:opacity .2s}
body.busy .spin{opacity:.9;animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#st{margin-top:30px;font-size:26px;font-weight:800;letter-spacing:-.3px}
body.on #st{color:var(--a2)}
.timer{margin-top:4px;font-size:18px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.srv{display:flex;align-items:center;gap:14px;width:100%;padding:14px;color:var(--text);text-align:left;font:inherit;cursor:pointer;margin-bottom:10px;position:relative}
.srv.sel{border-color:transparent;background:linear-gradient(var(--bg0),var(--bg0)) padding-box,linear-gradient(135deg,var(--a1),var(--a2)) border-box;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--a1),var(--a2)) border-box}
.av{flex:none;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-weight:800;font-size:19px;color:#fff;box-shadow:inset 0 -4px 10px rgba(0,0,0,.2)}
.meta{min-width:0;flex:1}.meta b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta small{color:var(--dim);font-size:13px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--line);text-transform:uppercase}
.chev{color:var(--dim);font-size:26px}
.del{flex:none;background:none;border:0;color:var(--dim);font-size:24px;padding:6px 8px;cursor:pointer}
.empty{padding:22px;text-align:center;color:var(--dim);border:1px dashed var(--line);border-radius:22px}
textarea,#q{width:100%;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--text);font:14px/1.4 ui-monospace,Menlo,Consolas,monospace}
#q{font:16px system-ui;margin-bottom:6px}
textarea{min-height:96px;resize:vertical}
.btn{width:100%;margin-top:10px;padding:15px;border:0;border-radius:16px;font:700 16px system-ui;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 8px 24px rgba(124,92,255,.35)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:none;box-shadow:none;border:1px solid var(--line);color:var(--text);font-weight:600}
.msg{margin:10px 4px 0;font-size:14px;color:var(--dim)}
.grp{padding:4px 16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border:0}
.row b{display:block;font-weight:600}.row small{color:var(--dim);font-size:13px}
.row.app{justify-content:flex-start}.row.app .sw{margin-left:auto}
.ico{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2))}
.sw{appearance:none;-webkit-appearance:none;flex:none;width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;cursor:pointer;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.sw:checked{background:linear-gradient(135deg,var(--a1),var(--a2))}
.sw:checked::after{transform:translateX(22px)}
.seg{display:flex;padding:4px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.seg button{flex:1;padding:11px;border:0;border-radius:12px;background:none;color:var(--dim);font:600 15px system-ui;cursor:pointer}
.seg button.act{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff}
.back{background:none;border:0;color:var(--a2);font:600 16px system-ui;cursor:pointer;padding:4px 0;margin-bottom:10px}
.note{color:var(--dim);font-size:13px;margin:14px 4px}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:4px;padding:6px;border-radius:28px;background:var(--navbg);border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 12px 40px rgba(0,0,0,.35);z-index:5}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:84px;padding:9px 6px;border:0;border-radius:22px;background:none;color:var(--dim);font:600 12px system-ui;cursor:pointer;transition:background .25s,color .25s}
.tabs svg{width:24px;height:24px}
.tabs button.act{color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2))}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translate(-50%,-90px);padding:12px 18px;border-radius:99px;background:var(--navbg);border:1px solid var(--line);backdrop-filter:blur(16px);font-size:14px;font-weight:600;z-index:9;transition:transform .35s cubic-bezier(.2,.9,.3,1.2);max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--a2);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"><i class="g1"></i><i class="g2"></i></div>
<div class="toast" id="toast" role="status"></div>
<main>

<section id="home" class="scr">
  <header class="bar">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="url(#lg)" stroke-width="2" stroke-linejoin="round"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c5cff"/><stop offset="1" stop-color="#19e3c5"/></linearGradient></defs><path d="M12 2l8 3v6c0 5-3.4 9.3-8 11-4.6-1.7-8-6-8-11V5z"/></svg>Мой VPN</div>
    <span class="badge">демо</span>
  </header>
  <div class="stage">
    <div class="orbwrap"><i class="ring"></i><i class="ring"></i><i class="ring"></i>
      <button class="orb" id="orb" aria-pressed="false" aria-label="Подключить"><span class="spin"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 3v8M6.3 6.6a8 8 0 1 0 11.4 0"/></svg>
      </button>
    </div>
    <h2 id="st">Не защищено</h2>
    <div class="timer" id="timer">00:00:00</div>
  </div>
  <h3>Выбранный сервер</h3>
  <button class="card srv" id="cur"></button>
</section>

<section id="servers" class="scr" hidden>
  <h1>Серверы</h1>
  <div id="list"></div>
  <h3>Добавить</h3>
  <textarea id="inp" placeholder="Вставьте vless://, vmess://, trojan://, ss:// или адрес подписки https://… (по одной ссылке в строке)"></textarea>
  <button class="btn" id="add">Добавить</button>
  <p class="msg" id="msg"></p>
</section>

<section id="settings" class="scr" hidden>
  <h1>Настройки</h1>
  <div class="card grp">
    <label class="row"><span><b>Запуск вместе с телефоном</b><small>Подключаться автоматически</small></span><input type="checkbox" class="sw" role="switch" data-k="autostart"></label>
    <label class="row"><span><b>Блокировать трафик без VPN</b><small>Если связь оборвётся, интернет отключится</small></span><input type="checkbox" class="sw" role="switch" data-k="kill"></label>
    <label class="row"><span><b>Не туннелировать локальную сеть</b><small>Принтер, роутер, устройства дома</small></span><input type="checkbox" class="sw" role="switch" data-k="lan"></label>
    <label class="row"><span><b>Раздельное туннелирование</b><small>Часть приложений идёт мимо VPN</small></span><input type="checkbox" class="sw" role="switch" data-k="split"></label>
  </div>
  <button class="btn ghost" id="pick" hidden>Выбрать приложения</button>
  <h3>Тема</h3>
  <div class="seg" id="theme"><button data-v="dark">Тёмная</button><button data-v="light">Светлая</button></div>
  <h3>Данные</h3>
  <button class="btn ghost" id="wipe" style="margin-top:0">Удалить все серверы</button>
  <p class="note">Это демо-интерфейс: настройки сохраняются, но сам туннель создаёт только нативная часть приложения.</p>
</section>

<section id="apps" class="scr" hidden>
  <button class="back" id="back">‹ Настройки</button>
  <h1>Мимо VPN</h1>
  <input id="q" type="search" placeholder="Найти приложение" aria-label="Найти приложение">
  <div class="card grp" id="applist"></div>
  <p class="note">Список для примера. В готовом приложении здесь будут все программы с телефона.</p>
</section>

</main>

<nav class="tabs">
  <button class="act" data-t="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Главная</button>
  <button data-t="servers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01" stroke-linecap="round"/></svg>Серверы</button>
  <button data-t="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Настройки</button>
</nav>

<script>
let servers=[],sel=null,on=false,busy=false,t0=0,tick=null,tt=null;
const $=id=>document.getElementById(id);
try{servers=JSON.parse(localStorage.getItem('srv')||'[]');sel=localStorage.getItem('sel')||null}catch(e){}
function save(){try{localStorage.setItem('srv',JSON.stringify(servers));localStorage.setItem('sel',sel||'')}catch(e){}}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2600)}
function b64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)))}
function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h}

function parse(line){
  line=line.trim();let m;
  if(m=line.match(/^(vless|trojan):\/\/([^@]+)@(\[[^\]]+\]|[^:\/?#]+):(\d+)\/?\??([^#]*)#?(.*)$/))
    return{proto:m[1],host:m[3],port:m[4],name:decodeURIComponent(m[6]||m[3]),raw:line};
  if(line.startsWith('vmess://')){const j=JSON.parse(b64(line.slice(8)));return{proto:'vmess',host:j.add,port:String(j.port),name:j.ps||j.add,raw:line}}
  if(line.startsWith('ss://')){
    let body=line.slice(5),name='';const h=body.indexOf('#');
    if(h>-1){name=decodeURIComponent(body.slice(h+1));body=body.slice(0,h)}
    if(body.indexOf('@')<0)body=b64(body.split('?')[0]);
    m=body.match(/@(\[[^\]]+\]|[^:\/?]+):(\d+)/);if(!m)throw 0;
    return{proto:'ss',host:m[1],port:m[2],name:name||m[1],raw:line};
  }
  throw 0;
}
function addLines(text){
  let ok=0,bad=0;
  text.split(/\r?\n/).forEach(l=>{
    if(!l.trim())return;
    try{const s=parse(l);if(servers.some(x=>x.raw===s.raw))return;
      s.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);servers.push(s);ok++}catch(e){bad++}
  });
  return{ok,bad};
}
async function add(){
  const v=$('inp').value.trim();
  if(!v){$('msg').textContent='Вставьте ссылку на сервер или подписку.';return}
  let text=v;
  if(/^https?:\/\//i.test(v)){
    $('msg').textContent='Загружаю подписку…';
    try{const r=await fetch(v);text=(await r.text()).trim();if(text.indexOf('://')<0)text=b64(text)}
    catch(e){$('msg').textContent='Не удалось загрузить подписку. Браузер мог заблокировать запрос; в приложении с нативной частью это обходится.';return}
  }
  const r=addLines(text);
  if(!sel&&servers.length)sel=servers[0].id;
  save();render();$('inp').value='';
  if(r.ok){$('msg').textContent='';toast('Добавлено серверов: '+r.ok+(r.bad?' (не распознано: '+r.bad+')':''))}
  else $('msg').textContent='Не удалось распознать ссылку. Она должна начинаться с vless://, vmess://, trojan:// или ss://';
}

function avatar(s){const a=document.createElement('span');a.className='av';a.textContent=(s.name[0]||'?').toUpperCase();const h=hue(s.host);a.style.background='linear-gradient(135deg,hsl('+h+' 75% 58%),hsl('+((h+50)%360)+' 75% 45%))';return a}
function fill(el,s){
  el.innerHTML='';el.appendChild(avatar(s));
  const m=document.createElement('span');m.className='meta';
  m.innerHTML='<b></b><small></small>';m.querySelector('b').textContent=s.name;m.querySelector('small').textContent=s.host+':'+s.port;
  el.appendChild(m);
  const t=document.createElement('span');t.className='tag';t.textContent=s.proto;el.appendChild(t);
}
function render(){
  const cur=servers.find(s=>s.id===sel),c=$('cur');
  if(cur){fill(c,cur);const ch=document.createElement('span');ch.className='chev';ch.textContent='›';c.appendChild(ch)}
  else c.innerHTML='<span class="meta"><b>Сервер не выбран</b><small>Нажмите, чтобы добавить</small></span><span class="chev">›</span>';
  const ul=$('list');ul.innerHTML='';
  if(!servers.length){ul.innerHTML='<div class="empty">Пока пусто. Добавьте ссылку ниже.</div>';return}
  servers.forEach(s=>{
    const d=document.createElement('div');d.className='card srv'+(s.id===sel?' sel':'');d.tabIndex=0;d.setAttribute('role','button');
    fill(d,s);
    const x=document.createElement('button');x.className='del';x.textContent='×';x.setAttribute('aria-label','Удалить');d.appendChild(x);
    const pickIt=()=>{if(on||busy){toast('Сначала отключите VPN');return}sel=s.id;save();render()};
    d.onclick=pickIt;d.onkeydown=e=>{if(e.key==='Enter')pickIt()};
    x.onclick=e=>{e.stopPropagation();if(on||busy){toast('Сначала отключите VPN');return}servers=servers.filter(z=>z.id!==s.id);if(sel===s.id)sel=servers[0]?servers[0].id:null;save();render()};
    ul.appendChild(d);
  });
}

function fmt(n){const p=x=>String(x).padStart(2,'0');return p(Math.floor(n/3600))+':'+p(Math.floor(n%3600/60))+':'+p(n%60)}
function setOn(v){
  on=v;document.body.classList.toggle('on',v);
  $('orb').setAttribute('aria-pressed',v);$('orb').setAttribute('aria-label',v?'Отключить':'Подключить');
  $('st').textContent=v?'Защищено':'Не защищено';
  clearInterval(tick);
  if(v){t0=Date.now();tick=setInterval(()=>{$('timer').textContent=fmt(Math.floor((Date.now()-t0)/1000))},500)}
  else $('timer').textContent='00:00:00';
}
$('orb').onclick=()=>{
  if(busy)return;
  if(on){setOn(false);return}
  if(!sel){toast('Сначала добавьте сервер');go('servers');return}
  busy=true;document.body.classList.add('busy');$('st').textContent='Подключение…';
  setTimeout(()=>{busy=false;document.body.classList.remove('busy');setOn(true);try{navigator.vibrate(20)}catch(e){}},1100);
};
$('cur').onclick=()=>go('servers');
$('add').onclick=add;

function go(n){
  ['home','servers','settings','apps'].forEach(x=>$(x).hidden=x!==n);
  const t=n==='apps'?'settings':n;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('act',b.dataset.t===t));
  window.scrollTo(0,0);
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.t));

let cfg={autostart:false,kill:false,lan:true,split:false,theme:'dark',bypass:[]};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('cfg')||'{}'))}catch(e){}
if(!Array.isArray(cfg.bypass))cfg.bypass=[];
function saveCfg(){try{localStorage.setItem('cfg',JSON.stringify(cfg))}catch(e){}}
function applyTheme(){
  document.documentElement.setAttribute('data-theme',cfg.theme);
  document.querySelectorAll('#theme button').forEach(b=>b.classList.toggle('act',b.dataset.v===cfg.theme));
}
function updPick(){$('pick').hidden=!cfg.split;$('pick').textContent='Выбрать приложения'+(cfg.bypass.length?' ('+cfg.bypass.length+')':'')}
document.querySelectorAll('.sw[data-k]').forEach(el=>{
  el.checked=!!cfg[el.dataset.k];
  el.onchange=()=>{cfg[el.dataset.k]=el.checked;saveCfg();updPick()};
});
document.querySelectorAll('#theme button').forEach(b=>b.onclick=()=>{cfg.theme=b.dataset.v;saveCfg();applyTheme()});
$('wipe').onclick=()=>{
  if(on||busy){toast('Сначала отключите VPN');return}
  if(!servers.length||!confirm('Удалить все серверы?'))return;
  servers=[];sel=null;save();render();toast('Серверы удалены');
};

const APPS=['Telegram','WhatsApp','YouTube','Chrome','Firefox','Instagram','TikTok','Discord','Steam','Spotify','Netflix','Яндекс Карты','Яндекс Браузер','Госуслуги','Банк','Почта','Камера','Галерея'];
function renderApps(){
  const q=$('q').value.trim().toLowerCase(),box=$('applist');box.innerHTML='';
  const items=APPS.filter(n=>n.toLowerCase().includes(q));
  if(!items.length){box.innerHTML='<p class="empty" style="margin:12px 0">Ничего не найдено.</p>';return}
  items.forEach(n=>{
    const l=document.createElement('label');l.className='row app';
    l.innerHTML='<span class="ico"></span><b></b><input type="checkbox" class="sw" role="switch">';
    l.querySelector('.ico').textContent=n[0];l.querySelector('b').textContent=n;
    const c=l.querySelector('input');c.checked=cfg.bypass.includes(n);
    c.onchange=()=>{cfg.bypass=c.checked?cfg.bypass.concat(n):cfg.bypass.filter(x=>x!==n);saveCfg();updPick()};
    box.appendChild(l);
  });
}
$('pick').onclick=()=>{$('q').value='';renderApps();go('apps')};
$('back').onclick=()=>go('settings');
$('q').oninput=renderApps;

applyTheme();updPick();render();
</script>
</body>
